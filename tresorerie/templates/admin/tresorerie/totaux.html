{% if totaux %}
<div class="flex flex-wrap gap-3 mb-4" aria-label="Totaux">
  {% for libelle, valeur, etat in totaux %}
  <div class="border border-base-200 dark:border-base-800 rounded-default px-4 py-2 bg-white dark:bg-base-900">
    <div class="text-xs text-base-500">{{ libelle }}</div>
    <div class="text-lg font-semibold {% if etat == 'ko' %}text-red-700 dark:text-red-400{% elif etat == 'ok' %}text-green-700 dark:text-green-400{% endif %}">{{ valeur }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
